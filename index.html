<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WWE Legacy">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=0.13.72">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png?v=0.13.72">
  <link rel="manifest" href="./manifest.webmanifest?v=0.13.72">
  <title>WWE Legacy: Collectible Card Game</title>
  <link rel="stylesheet" href="./css/game.css?v=0.13.72">
  <script>
    (() => {
      const currentBuild = "0.13.72";
      window.__WWE_LEGACY_BOOT_VERSION__ = currentBuild;
      const parts = value => String(value ?? "").replace(/^v/i, "").split(".").slice(0, 3).map(Number);
      const newer = (latest, current) => {
        const a = parts(latest), b = parts(current);
        if (a.length !== 3 || b.length !== 3 || a.some(Number.isNaN) || b.some(Number.isNaN)) return false;
        for (let i = 0; i < 3; i += 1) { if (a[i] !== b[i]) return a[i] > b[i]; }
        return false;
      };
      const check = async () => {
        try {
          const manifest = new URL("./build.json", location.href);
          manifest.searchParams.set("_", String(Date.now()));
          const response = await fetch(manifest.toString(), { cache: "no-store" });
          if (!response.ok) return;
          const latest = String((await response.json())?.version ?? "");
          if (!newer(latest, currentBuild)) {
            try { sessionStorage.removeItem(`wwe-legacy-update-attempts:${latest}`); } catch {}
            return;
          }
          const key = `wwe-legacy-update-attempts:${latest}`;
          let attempts = 0;
          try { attempts = Number(sessionStorage.getItem(key) ?? 0); } catch {}
          if (attempts >= 3) return;
          try { sessionStorage.setItem(key, String(attempts + 1)); } catch {}
          const target = new URL(location.href);
          target.searchParams.set("build", latest);
          target.searchParams.set("_update", String(Date.now()));
          location.replace(target.toString());
        } catch {}
      };
      check();
    })();
  </script>
</head>
<body>
  <main>
    <header id="app-topbar" class="legacy-gamebar" aria-label="WWE Legacy status" hidden>
      <button type="button" id="chrome-home" class="gamebar-brand" aria-label="Return Home">
        <img class="gamebar-app-icon" src="./assets/icons/icon-192.png?v=0.13.72" alt="WWE Legacy">
      </button>
      <button type="button" id="chrome-season" class="gamebar-season" aria-label="Open Season">
        <span><small class="gamebar-season-title"><span>SEASON</span><em>1</em></small><b data-chrome-tier>TIER 0</b></span>
        <i class="gamebar-tier-track"><em data-chrome-tier-bar></em></i>
      </button>
      <div class="gamebar-resources">
        <button type="button" id="chrome-packs" aria-label="Open Booster Packs"><small>PACKS</small><b data-chrome-packs>0</b></button>
        <span class="gamebar-up"><small>UP</small><b data-chrome-up>0</b></span>
      </div>
    </header>
    <div id="game" aria-live="polite"></div>
    <nav class="mobile-game-nav compact-eight-nav" id="mobile-game-nav" aria-label="Primary navigation" hidden>
      <button type="button" data-mobile-nav="menu" aria-label="Home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg></span><b>HOME</b></button>
      <button type="button" data-mobile-nav="play-menu" aria-label="Play"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 4.5 19 12 6 19.5z"/></svg></span><b>PLAY</b></button>
      <button type="button" data-mobile-nav="deck-builder" aria-label="Deck Lab"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 5h12v14H6z"/><path d="M9 2h12v14M3 8h3"/></svg></span><b>DECK LAB</b></button>
      <button type="button" data-mobile-nav="seasons" aria-label="Season"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span><b>SEASON</b></button>
      <button type="button" data-mobile-nav="challenges" aria-label="Challenges"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7z"/><path d="M9 8l2 2 4-4M9 14h6"/></svg></span><b>CHALLENGES</b></button>
      <button type="button" data-mobile-nav="boosters" aria-label="Packs"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 3h8M8 21h8"/></svg></span><b>PACKS</b></button>
      <button type="button" data-mobile-nav="store" aria-label="Store"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM3 8l2-5h14l2 5"/><path d="M9 12h6"/></svg></span><b>STORE</b></button>
      <button type="button" data-mobile-nav="collection" aria-label="Collection"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="12" height="16" rx="2"/><path d="M9 7h4M9 11h4"/></svg></span><b>COLLECTION</b></button>
      <button type="button" data-mobile-nav="catalogue" aria-label="Catalogue"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg></span><b>CATALOGUE</b></button>
      <button type="button" data-mobile-nav="profile" aria-label="My Legacy"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4.2 3.3-6.3 7.5-6.3s6.7 2.1 7.5 6.3"/></svg></span><b>LEGACY</b></button>
    </nav>
  </main>
  <script type="module" src="./js/ui/app.js?v=0.13.72"></script>
</body>
</html>
