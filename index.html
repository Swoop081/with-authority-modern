<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WWE Legacy">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>WWE Legacy: Collectible Card Game</title>
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <main>
    <header class="topbar" id="app-topbar">
      <button class="brand-home" id="brand-home" type="button" aria-label="WWE Legacy main menu">
        <span class="brand-wwe">WWE</span><span class="brand-legacy">LEGACY</span><small>COLLECTIBLE CARD GAME</small>
      </button>
      <span class="build-label">v0.11.10</span>
    </header>
    <div id="game" aria-live="polite"></div>
    <nav class="mobile-game-nav" id="mobile-game-nav" aria-label="Primary navigation" hidden>
      <button type="button" data-mobile-nav="menu"><span class="nav-glyph">⌂</span><b>HOME</b></button>
      <button type="button" data-mobile-nav="play-menu"><span class="nav-glyph">▶</span><b>PLAY</b></button>
      <button type="button" data-mobile-nav="collection"><span class="nav-glyph">▣</span><b>CARDS</b></button>
      <button type="button" data-mobile-nav="boosters"><span class="nav-glyph">✦</span><b>PACKS</b></button>
      <button type="button" data-mobile-nav="seasons"><span class="nav-glyph">◆</span><b>SEASON</b></button>
      <button type="button" data-mobile-nav="options"><span class="nav-glyph">⚙</span><b>OPTIONS</b></button>
    </nav>
  </main>
  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
