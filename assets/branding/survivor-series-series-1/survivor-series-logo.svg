<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Survivor Series — Series 1</title>
  <desc id="desc">WWE Legacy development identity for Survivor Series Series 1, with red and blue opposing-team colours.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b42a8"/>
      <stop offset="0.48" stop-color="#17284a"/>
      <stop offset="0.52" stop-color="#5d1424"/>
      <stop offset="1" stop-color="#d11f3a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#e9eef6"/>
      <stop offset="1" stop-color="#9eacc1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M360 18 575 75 540 214 360 263 180 214 145 75Z" fill="#05070d" stroke="#d8e0eb" stroke-width="8"/>
    <path d="M360 31 558 83 527 202 360 247 193 202 162 83Z" fill="url(#shield)" stroke="#131d30" stroke-width="4"/>
    <path d="M360 37v204" stroke="#e7edf6" stroke-width="5" opacity=".78"/>
    <path d="m222 105 82 34-82 34m276-68-82 34 82 34" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="square" opacity=".92"/>
    <text x="360" y="77" text-anchor="middle" fill="#ffffff" font-family="Arial Black,Impact,sans-serif" font-size="23" font-style="italic" letter-spacing="7">WWE LEGACY</text>
    <text x="360" y="148" text-anchor="middle" fill="url(#word)" stroke="#05070d" stroke-width="5" paint-order="stroke" font-family="Arial Black,Impact,sans-serif" font-size="72" font-style="italic" letter-spacing="-3">SURVIVOR</text>
    <text x="360" y="202" text-anchor="middle" fill="url(#word)" stroke="#05070d" stroke-width="5" paint-order="stroke" font-family="Arial Black,Impact,sans-serif" font-size="61" font-style="italic" letter-spacing="6">SERIES</text>
    <text x="360" y="229" text-anchor="middle" fill="#ffffff" font-family="Arial Black,Impact,sans-serif" font-size="17" letter-spacing="8">SERIES 1</text>
  </g>
