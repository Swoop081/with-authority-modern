<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>WWE Legacy — Bulk PNG/JPG to WebP</title><link rel="stylesheet" href="../css/card-art-studio.css?v=0.11.42"><style>.converter-shell{max-width:900px;margin:auto;padding:calc(58px + env(safe-area-inset-top)) 16px 60px}.converter-shell h1{font-size:clamp(2rem,8vw,4rem);margin:.2em 0}.converter-panel{border:1px solid #35353e;border-radius:18px;background:#111117;padding:16px;display:grid;gap:14px}.converter-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.converter-list{display:grid;gap:7px}.convert-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:9px 10px;border:1px solid #2e2e35;border-radius:10px}.convert-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.convert-row small{color:#9c9ca6}.convert-row b{color:#efc75c}.converter-total{font-size:.85rem;color:#c8c8d0}.converter-note{color:#9696a0;line-height:1.5;font-size:.78rem}@media(max-width:600px){.converter-actions{grid-template-columns:1fr}.convert-row{grid-template-columns:minmax(0,1fr) auto}.convert-row b{grid-column:2}.convert-row small{grid-column:1}}</style></head><body><main class="converter-shell"><a class="studio-brand" href="./card-art-studio.html"><span>WWE</span><b>LEGACY</b><small>ART TOOLS</small></a><span class="eyebrow">BULK ARTWORK UTILITY</span><h1>PNG / JPG → WebP</h1><p class="converter-note">Select a folder or multiple images. Files keep their original base names and are converted to WebP. The ZIP uses stored entries because the images are already compressed; the size saving comes from WebP itself.</p><section class="converter-panel"><label class="file-picker">Choose multiple images<input id="bulk-files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label class="file-picker">Or choose a folder (desktop Chromium)<input id="bulk-folder" type="file" accept="image/*" multiple webkitdirectory directory></label><label>WebP quality <output id="bulk-quality-value">88%</output><input id="bulk-quality" type="range" min="60" max="96" value="88"></label><div class="converter-actions"><button id="convert-preview">Convert & Review</button><button id="download-zip" class="primary" disabled>Download WebP ZIP</button></div><p id="bulk-status" class="status" aria-live="polite"></p><div id="bulk-total" class="converter-total"></div><div id="bulk-list" class="converter-list"></div></section></main><script src="../js/tools/png-to-webp-converter.js?v=0.11.42"></script></body></html>
